apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phone-api.fullname" . }}-secrets
  labels:
    {{- include "phone-api.labels" . | nindent 4 }}
type: Opaque
# IMPORTANT: Replace the placeholder values below with actual secrets
# Use one of these methods to create the secret:
#
# 1. Via kubectl:
#    kubectl create secret generic phone-api-secrets \
#      --from-literal=redis-password='YOUR_REDIS_PASSWORD' \
#      --from-literal=db-password='YOUR_MONGODB_PASSWORD' \
#      --from-literal=mailgun-key='YOUR_MAILGUN_KEY' \
#      -n default
#
# 2. Via Helm values (recommended):
#    helm install phone-api ./phone-api \
#      --set-string secrets.redisPassword='YOUR_REDIS_PASSWORD' \
#      --set-string secrets.dbPassword='YOUR_MONGODB_PASSWORD' \
#      --set-string secrets.mailgunKey='YOUR_MAILGUN_KEY'
#
# 3. Via Azure Key Vault (preferred for production):
#    Update the values.yaml to reference the Key Vault provider
#
stringData:
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  mailgun-key: {{ .Values.secrets.mailgunKey | quote }}
