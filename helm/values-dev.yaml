# Default values for all microservices - Development Environment
# This is a YAML-formatted file.

# Global settings
global:
  environment: dev
  region: cin
  registry: acrreewnprod.azurecr.io
  domain: dev.rewn.com

# Replica settings
replicaCount: 2

# Image pull settings
imagePullSecrets:
  - name: acr-secret

# Resources for DEV (smaller than prod)
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling for DEV
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress configuration
ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  tls:
    enabled: true

# Database configuration - DEV
database:
  host: "mysql-rewn-dev-cin.mysql.database.azure.com"
  port: 3306
  user: "devadmin"

# Cache configuration - DEV
cache:
  enabled: true
  host: "redis-rewn-dev-cin.redis.cache.windows.net"
  port: 6379
  ttl: 3600

# Logging
logging:
  level: DEBUG
  format: json

# Monitoring
monitoring:
  enabled: true
  prometheus: true
  applicationInsights: true

# Security
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Pod disruption budget
podDisruptionBudget:
  enabled: false

# Priority class
priorityClassName: "default-priority"
