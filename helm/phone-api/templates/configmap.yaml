apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "phone-api.fullname" . }}-config
  labels:
    {{- include "phone-api.labels" . | nindent 4 }}
data:
  # MongoDB replica set connection string
  db-hosts: {{ .Values.config.dbHosts | quote }}
  
  # Elasticsearch cluster hosts (JSON array format)
  es-hosts: {{ .Values.config.esHosts | quote }}
  
  # Database configuration
  db-auth-source: {{ .Values.database.authSource | quote }}
  db-replica-set: {{ if .Values.database.replicaSet }}"enabled"{{ else }}"disabled"{{ end }}
  
  # Elasticsearch configuration
  es-client-timeout: {{ .Values.elasticsearch.clientTimeout | quote }}
  es-max-retries: {{ .Values.elasticsearch.maxRetries | quote }}
  
  # Redis configuration
  redis-db: {{ .Values.redis.db | quote }}
  redis-connect-timeout: {{ .Values.redis.connectTimeout | quote }}
