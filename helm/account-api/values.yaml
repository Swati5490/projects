replicaCount: 3

image:
  registry: acrreewnprod.azurecr.io
  repository: account-api
  tag: "production"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: acr-secret

nameOverride: ""
fullnameOverride: "account-api"

serviceAccount:
  create: true
  annotations: {}
  name: "account-api-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "azure/application-gateway"
  hosts:
    - host: "account-api.rewn.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: account-api-tls
      hosts:
        - "account-api.rewn.com"

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - account-api
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

env:
  # Redis configuration (from ECS task definition)
  REDIS_HOST: redis.rewn-state
  REDIS_PORT: "43768"
  
  # MongoDB configuration
  DB_HOSTS: mongorep1.rewn-state:37451,mongorep2.rewn-state:37451,mongorep3.rewn-state:37451
  DB_USERNAME: mongo_admin
  
  # External services
  SCI_NET_URL: https://scinet.rewn.io/v1
  AUTH_API_URL: https://auth.rewn.io
  
  # PayPal configuration
  PAYPAL_ENVIRONMENT: live
  
  # CRM configuration
  INFUSION_APP: m400
  
  # Application settings
  NODE_ENV: production
  LOGGING_LEVEL: info
  LOGGIN_CONSOLE: "true"

secretProvider:
  provider: azure
  keyvault:
    name: "kv-rewn-prod-cin"
    tenantId: "{{AZURE_TENANT_ID}}"
  secrets:
    # Secrets extracted from ECS hardcoded values
    - name: redis-password
      objectName: account-api-redis-password
    - name: db-password
      objectName: account-api-db-password
    - name: paypal-client-id
      objectName: account-api-paypal-client-id
    - name: paypal-client-secret
      objectName: account-api-paypal-client-secret
    - name: infusion-key
      objectName: account-api-infusion-key

configMap:
  enabled: true
  data:
    app.config: |
      [server]
      port=8080
      workers=4
      
      [database]
      pool_size=10
      max_overflow=20
      
      [logging]
      level=INFO
      format=json

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 53

priorityClassName: "high-priority"
