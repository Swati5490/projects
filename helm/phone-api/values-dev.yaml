replicaCount: 1

image:
  # TODO: AKS migration ke time image ko Azure Container Registry (ACR) me migrate karein
  repository: phone-api
  tag: develop
  pullPolicy: Always

container:
  name: phone-api
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 256m
    memory: 512Mi

  limits:
    # TODO: Actual CPU/Memory usage dekhkar limits tune karni hain
    cpu: 256m
    memory: 512Mi

env:
  NODE_ENV: development
  SEEDING: auto

  # Redis dependency
  REDIS_HOST: redis--develop.rewn-develop-state
  REDIS_PORT: "6379"

  # MongoDB dependency
  DB_USERNAME: mongo_admin
  DB_HOSTS: "mongodevrep1.rewn-state:37451,mongodevrep2.rewn-state:37451,mongodevrep3.rewn-state:37451"

  # Elasticsearch dependency
  # TODO: AWS EC2 internal Elasticsearch endpoints ko Azure Elasticsearch
  # compatible service/endpoints se replace karna hoga.
  ES_HOSTS: '["http://ip-172-31-19-160.ec2.internal:9200/","http://ip-172-31-23-185.ec2.internal:9200/","http://ip-172-31-16-174.ec2.internal:9200/","http://ip-172-31-31-165.ec2.internal:9200/","http://ip-172-31-28-51.ec2.internal:9200/"]'

  # Service-to-service communication
  ACCOUNT_API_URL: "https://account.dev.rewn.io/v1"
  JWKS_ENDPOINT: "https://auth.dev.rewn.io/oidc/jwks"

# Sensitive values Azure Key Vault se Secrets Store CSI Driver ke through inject honge
keyVault:
  enabled: true

  secrets:
    - MAILGUN_KEY
    - DB_PASSWORD

azureMonitor:
  enabled: true
  # Container Insights / Azure Monitor Agent AKS cluster level par configured hoga

ingress:
  enabled: false

  # TODO: Check karna hai kya phone-api ko externally expose karna hai.
  # Agar sirf internal microservice hai to ClusterIP sufficient hai.