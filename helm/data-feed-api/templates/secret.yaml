apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-feed-api.fullname" . }}-secrets
  labels:
    {{- include "data-feed-api.labels" . | nindent 4 }}
type: Opaque
# IMPORTANT: Replace the placeholder values below with actual secrets
# Use one of these methods to create the secret:
#
# 1. Via kubectl:
#    kubectl create secret generic data-feed-api-secrets \
#      --from-literal=mongo-password='YOUR_MONGODB_PASSWORD' \
#      --from-literal=redis-password='YOUR_REDIS_PASSWORD' \
#      --from-literal=zillow-key='YOUR_ZILLOW_API_KEY' \
#      -n default
#
# 2. Via Helm values (recommended):
#    helm install data-feed-api ./data-feed-api \
#      --set-string secrets.mongoPassword='YOUR_MONGODB_PASSWORD' \
#      --set-string secrets.redisPassword='YOUR_REDIS_PASSWORD' \
#      --set-string secrets.zillowKey='YOUR_ZILLOW_API_KEY'
#
# 3. Via Azure Key Vault (preferred for production):
#    Update the values.yaml to reference the Key Vault provider
#
stringData:
  mongo-password: {{ .Values.secrets.mongoPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  zillow-key: {{ .Values.secrets.zillowKey | quote }}
