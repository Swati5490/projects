replicaCount: 1

image:
  # AKS migration ke time image ko Azure Container Registry (ACR) me migrate karein
  repository: rewn-chat
  tag: production
  pullPolicy: Always

container:
  name: rewn-chat
  port: 8080

service:
  type: ClusterIP
  # ECS hostPort = 80
  port: 80
  targetPort: 8080

resources:
  requests:
    # ECS CPU = 128 units (~0.125 vCPU)
    # ECS Memory Reservation = 8 MiB
    cpu: 125m
    memory: 8Mi

  limits:
    # Actual production utilization dekhkar tune karna chahiye
    cpu: 250m
    memory: 128Mi

# ECS task definition me koi environment variables configured nahi hain
env: {}

# ECS task definition me koi sensitive secrets configured nahi hain
keyVault:
  enabled: false

  secrets: []

# Azure AKS monitoring
azureMonitor:
  enabled: true
  # Container Insights / Azure Monitor Agent
  # AKS cluster level par configured hoga

# ECS health check:
# curl -f http://localhost:8080/health-check
#
# Production ECS retries = 5
healthCheck:
  enabled: true

  livenessProbe:
    httpGet:
      path: /health-check
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health-check
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

# Production external access requirement confirm karna hoga
ingress:
  enabled: false

  className: ""

  # Agar chat application external URL se accessible hai:
  #
  # hosts:
  #   - host: "chat.rewn.io"
  #     paths:
  #       - path: /
  #         pathType: Prefix