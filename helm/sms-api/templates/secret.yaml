apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sms-api.fullname" . }}-secrets
  labels:
    {{- include "sms-api.labels" . | nindent 4 }}
type: Opaque
# IMPORTANT: Replace the placeholder values below with actual secrets
# Use one of these methods to create the secret:
#
# 1. Via kubectl:
#    kubectl create secret generic sms-api-secrets \
#      --from-literal=redis-password='YOUR_REDIS_PASSWORD' \
#      --from-literal=twilio-app-key='YOUR_TWILIO_APP_KEY' \
#      --from-literal=twilio-app-token='YOUR_TWILIO_APP_TOKEN' \
#      -n default
#
# 2. Via Helm values (recommended):
#    helm install sms-api ./sms-api \
#      --set-string secrets.redisPassword='YOUR_REDIS_PASSWORD' \
#      --set-string secrets.twilioAppKey='YOUR_TWILIO_APP_KEY' \
#      --set-string secrets.twilioAppToken='YOUR_TWILIO_APP_TOKEN'
#
# 3. Via Azure Key Vault (preferred for production):
#    Update the values.yaml to reference the Key Vault provider
#
stringData:
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  twilio-app-key: {{ .Values.secrets.twilioAppKey | quote }}
  twilio-app-token: {{ .Values.secrets.twilioAppToken | quote }}
