replicaCount: 1

image:
  # TODO: AKS migration ke time image ko Azure Container Registry (ACR) me migrate karein
  repository: images
  tag: develop
  pullPolicy: Always

container:
  name: images
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    # ECS task CPU = 128 units (~125m CPU)
    cpu: 128m
    memory: 512Mi

  limits:
    # TODO: Actual CPU/Memory usage dekhkar limits tune karni hain
    cpu: 128m
    memory: 512Mi

env: {}
# No environment variables or service dependencies found in ECS task definition

# No secrets found in the ECS task definition
keyVault:
  enabled: false
  secrets: []

# Azure AKS monitoring
azureMonitor:
  enabled: true
  # Container Insights / Azure Monitor Agent AKS cluster level par configured hoga

ingress:
  enabled: false
  # TODO: Check karna hai kya images service externally expose karni hai.
  # Agar sirf internal microservice hai to ClusterIP sufficient hai.