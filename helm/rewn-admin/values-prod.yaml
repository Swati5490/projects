replicaCount: 1

image:
  # AKS migration ke time image ko Azure Container Registry (ACR) me migrate karein
  repository: rewn-admin
  tag: production
  pullPolicy: Always

container:
  name: rewn-admin
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    # ECS Task CPU = 256 units (~0.25 vCPU)
    # ECS Task Memory = 256 MiB
    cpu: 250m
    memory: 256Mi

  limits:
    # Actual production utilization dekhkar limits tune karni hain
    cpu: 500m
    memory: 512Mi

env:
  VITE_APP_URL: "admin.rewn.io/"
  VITE_ENVIRONMENT: "production"
  VITE_CIRCLE_BRANCH: "main"

# ECS task definition me koi sensitive secret configured nahi hai
keyVault:
  enabled: false

  secrets: []

# Azure AKS monitoring
azureMonitor:
  enabled: true
  # Container Insights / Azure Monitor Agent
  # AKS cluster level par configured hoga

# Production admin application
ingress:
  enabled: true

  className: ""

  hosts:
    - host: "admin.rewn.io"
      paths:
        - path: /
          pathType: Prefix