global:
  environment: prod
  region: eastus

replicaCount: 3

image:
  registry: acrreewnprod.azurecr.io
  repository: geo-api
  tag: production
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: acr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "azure/application-gateway"
  hosts:
    - host: geo-api.rewn.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: geo-api-tls
      hosts:
        - geo-api.rewn.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

nodeSelector: {}

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - geo-api
          topologyKey: kubernetes.io/hostname

tolerations: []

priorityClassName: high-priority

podDisruptionBudget:
  enabled: true
  minAvailable: 2

volumes:
  secrets:
    csiDriver: secrets-store.csi.k8s.io
    provider: azure
  tmp:
    emptyDir: {}
  cache:
    emptyDir: {}

volumeMounts:
  secrets: /mnt/secrets
  tmp: /tmp
  cache: /var/cache

env:
  # Elasticsearch configuration (from ECS task definition - 5 node cluster)
  DB_HOSTS: '["http://ip-172-31-19-160.ec2.internal:9200/","http://ip-172-31-23-185.ec2.internal:9200/","http://ip-172-31-16-174.ec2.internal:9200/","http://ip-172-31-31-165.ec2.internal:9200/","http://ip-172-31-28-51.ec2.internal:9200/"]'
  
  # Redis configuration
  REDIS_HOST: redis.rewn-state
  REDIS_PORT: "43768"
  
  # Application settings
  NODE_ENV: production
  
  # Authentication - OIDC
  JWKS_ENDPOINT: https://auth.rewn.io/oidc/jwks

# Secrets stored in Azure Key Vault
# Extracted from ECS hardcoded values
secrets:
  - name: redis-password
    keyVault: kv-rewn-prod-cin
    keyVaultKey: geo-api-redis-password
    value: "r2t6Oc;5n([](VHR=J<NG6r(K3X>}oWh"

# Monitoring configuration
monitoring:
  enabled: true
  logAnalytics:
    enabled: true
    workspaceId: law-rewn-prod-cin
  applicationInsights:
    enabled: true
    instrumentationKey: ai-rewn-prod-cin
  prometheus:
    enabled: true
    port: 8080
    path: /metrics

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow Elasticsearch
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
    # Allow Redis
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
    # Allow external HTTPS (auth, APIs)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

# ConfigMap data
configMap:
  app.config: |
    [server]
    port = 8080
    workers = 4
    
    [elasticsearch]
    connection_pool_size = 10
    max_overflow = 20
    request_timeout = 30
    
    [redis]
    connection_pool_size = 10
    max_connections = 50
    socket_timeout = 5
    
    [logging]
    level = INFO
    format = json
    
    [auth]
    jwks_cache_ttl = 3600
    token_expiry_buffer = 60

# Cache settings
cache:
  ttl: 86400
  redis_db: 2

# Feature flags
features:
  locationCaching: true
  elasticsearchSharding: true
  redisClustering: true
