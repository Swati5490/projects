replicaCount: 3

image:
  repository: 770526846351.dkr.ecr.us-east-1.amazonaws.com/mail-manager-api
  pullPolicy: IfNotPresent
  tag: production

imagePullSecrets:
  - name: ecr-pull-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  name: mail-manager-api

ingress:
  enabled: true
  className: azure-application-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    azure.microsoft.com/waf-policy-priority: "1"
  hosts:
    - host: mail-manager.rewn.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mail-manager-tls
      hosts:
        - mail-manager.rewn.com

resources:
  requests:
    cpu: 64m
    memory: 128Mi
  limits:
    cpu: 256m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  logLevel: debug
  nodeEnv: production
  
  # Internal APIs
  dataApiUrl: https://data.rewn.io/v2
  accountApiUrl: https://account.rewn.io/v1
  sciNetUrl: https://scinet.rewn.io/v1
  motivatedApiUrl: https://motivated.rewn.io/v1

  # Redis Configuration
  redisHost: redis.rewn-state
  redisPort: "43768"

  # MongoDB Configuration
  dbHosts: mongorep1.rewn-state:37451,mongorep2.rewn-state:37451,mongorep3.rewn-state:37451
  dbUsername: mongo_admin

secrets:
  redisPassword: ""
  dbPassword: ""
  mailgunKey: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsReadOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

nodeSelector: {}

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mail-manager-api
          topologyKey: kubernetes.io/hostname

tolerations: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
