apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mail-manager-api.fullname" . }}-secrets
  labels:
    {{- include "mail-manager-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  mailgun-key: {{ .Values.secrets.mailgunKey | quote }}
