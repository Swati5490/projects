# REWN FastAPI - Helm Chart Values
# Multi-database service with AI/ML components

replicaCount: 3

image:
  repository: 770526846351.dkr.ecr.us-east-1.amazonaws.com/rewn-fastapi
  pullPolicy: IfNotPresent
  tag: "production"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsReadOnlyRootFilesystem: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 512m
    memory: 1024Mi
  limits:
    cpu: 1000m
    memory: 3072Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "azure/application-gateway"
  hosts:
    - host: api.rewn.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rewn-fastapi-tls
      hosts:
        - api.rewn.io

healthCheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Environment variables (non-sensitive)
env:
  ENV_MODE: "production"
  ENV_PORT: "8080"
  REDIS_HOST: "redis.rewn-state"
  REDIS_PORT: "43768"
  MONGO_HOST: "mongo.rewn-state"
  MONGO_HOSTS: "mongorep1.rewn-state:37451,mongorep2.rewn-state:37451,mongorep3.rewn-state:37451"
  MONGO_USERNAME: "mongo_admin"
  MYSQL_HOST: "production-whm.c0jpywzdh6dm.us-east-1.rds.amazonaws.com"
  MYSQL_USERNAME: "funnels"
  CHROMA_HOST: "172.31.103.129"
  OLLAMA_API_HOST: "http://172.31.13.127:8080"
  JWKS_ENDPOINT: "https://auth.rewn.io/oidc/jwks"

# Secrets (should be populated from Key Vault)
secrets:
  redisPassword: ""
  mongoPassword: ""
  mysqlPassword: ""
  ollamaApiKey: ""

# PodDisruptionBudget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Node affinity and pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - rewn-fastapi
          topologyKey: kubernetes.io/hostname

# Tolerations
tolerations: []
