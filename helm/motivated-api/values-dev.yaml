replicaCount: 1

image:
  # TODO: AKS migration ke time image ko Azure Container Registry (ACR) me migrate karein
  repository: motivated-api
  tag: develop
  pullPolicy: Always

container:
  name: motivated-api
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 256m
    memory: 512Mi

  limits:
    # TODO: Actual CPU/Memory usage dekhkar limits tune karni hain
    cpu: 256m
    memory: 512Mi

env:
  NODE_ENV: development
  SEEDING: auto

  # Service-to-service communication
  DATA_API_URL: "https://data.dev.rewn.io/v2"
  ACCOUNT_API_URL: "https://account.dev.rewn.io/v1"
  AUTH_API_URL: "https://auth.dev.rewn.io"
  MYSQL_API_URL: "https://mysql.dev.rewn.io/v1"
  JWKS_ENDPOINT: "https://auth.dev.rewn.io/oidc/jwks"

  # Redis dependency
  REDIS_HOST: redis--develop.rewn-develop-state

  # MongoDB dependency - Replica Set
  DB_HOSTS: "mongodevrep1.rewn-state:37451,mongodevrep2.rewn-state:37451,mongodevrep3.rewn-state:37451"
  DB_USERNAME: mongo_admin

  # External AI/Ollama service
  OLLAMA_HOST: "http://44.216.218.53:8080"

  # Mail service configuration
  MAILGUN_DOMAIN: mg.rewn.com

# Sensitive values Azure Key Vault se Secrets Store CSI Driver ke through inject honge
keyVault:
  enabled: true

  secrets:
    - MAILGUN_KEY
    - OLLAMA_API_KEY
    - DB_PASSWORD

# Azure AKS monitoring
azureMonitor:
  enabled: true
  # Container Insights / Azure Monitor Agent AKS cluster level par configured hoga

ingress:
  enabled: false
  # TODO: Check karna hai kya motivated-api ko externally expose karna hai.
  # Agar sirf internal microservice hai to ClusterIP sufficient hai.