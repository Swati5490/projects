apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geo-api.fullname" . }}-config
  labels:
    {{- include "geo-api.labels" . | nindent 4 }}
data:
  app.config: |
    [server]
    port = 8080
    workers = 4
    
    [elasticsearch]
    connection_pool_size = 10
    max_overflow = 20
    request_timeout = 30
    
    [redis]
    connection_pool_size = 10
    max_connections = 50
    socket_timeout = 5
    
    [logging]
    level = INFO
    format = json
    
    [auth]
    jwks_cache_ttl = 3600
    token_expiry_buffer = 60
