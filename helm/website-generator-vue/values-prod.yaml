replicaCount: 1

image:
  # AKS migration ke time image ko Azure Container Registry (ACR) me migrate karein
  repository: website-generator-vue
  tag: production
  pullPolicy: Always

container:
  name: website-generator-vue
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  # ECS task:
  # CPU = 512 units ≈ 0.5 vCPU
  # Memory = 1024 MiB

  requests:
    cpu: 500m
    memory: 1Gi

  limits:
    cpu: 500m
    memory: 1Gi

env:
  # No environment variables are defined in the ECS task definition
  {}

# No sensitive values are defined in the ECS task definition
keyVault:
  enabled: false

  secrets: []

# Azure AKS Monitoring
azureMonitor:
  enabled: true
  # Container Insights / Azure Monitor Agent
  # AKS cluster level par configured hoga

# ECS task definition me health check defined nahi hai
healthCheck:
  enabled: false
  path: "/"
  port: 8080

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 3

ingress:
  enabled: false

  # TODO: Confirm whether website-generator-vue requires external access.
  # Agar sirf internal microservice hai to ClusterIP sufficient hai.