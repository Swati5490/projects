apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geo-api.fullname" . }}-secrets
  labels:
    {{- include "geo-api.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded secrets from ECS task definition
  # IMPORTANT: Replace these with actual values from Azure Key Vault in production
  redis-password: {{ "r2t6Oc;5n([](VHR=J<NG6r(K3X>}oWh" | b64enc | quote }}
  auth-secret: {{ "changeme-set-via-key-vault" | b64enc | quote }}
