replicaCount: 1

image:
  # TODO: AKS migration ke time image ko Azure Container Registry (ACR) me migrate karein
  repository: private-lender-marketplace-api
  tag: production
  pullPolicy: Always

container:
  name: private-lender-marketplace-api
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    # ECS task CPU = 1024, Memory = 3072
    cpu: 1000m
    memory: 3Gi

  limits:
    # TODO: Actual CPU/Memory utilization dekhkar limits tune karni hain
    cpu: 1000m
    memory: 3Gi

env:
  NODE_ENV: production
  LOGGING_LEVEL: info

  # Service-to-service communication
  ACCOUNT_API_URL: "https://account.rewn.io"
  AUTH_API_URL: "https://auth.rewn.io"
  MYSQL_API_URL: "https://mysql.rewn.io/v1"
  JWKS_ENDPOINT: "https://auth.rewn.io/oidc/jwks"

  # Redis
  REDIS_HOST: "redis.rewn-state"
  REDIS_PORT: "43768"

  # MongoDB
  DB_HOSTS: "mongorep1.rewn-state:37451,mongorep2.rewn-state:37451,mongorep3.rewn-state:37451"
  DB_USERNAME: "mongo_admin"

  # Application configuration
  APP_DOMAIN: "plm-api.rewn.io"

  # AWS configuration
  AWS_REGION: "us-east-1"
  PLM_DOCUMENT_KMS_KEY_ARN: "arn:aws:kms:us-east-1:770526846351:key/366d4c91-ee00-4596-9e40-a55b25ef457b"
  PLM_DOCUMENT_BUCKET: "plm-private-documents-770526846351-us-east-1-an"

  # Comet configuration
  COMET_APP_ID: "25941202267ba6be"

# Sensitive values Azure Key Vault se Secrets Store CSI Driver ke through inject honge
keyVault:
  enabled: true

  secrets:
    - MAILGUN_KEY
    - STRIPE_SECRET_KEY
    - COMET_AUTH_TOKEN
    - AWS_SECRET_ACCESS_KEY
    - AWS_ACCESS_KEY_ID
    - STRIPE_WEBHOOK_SECRET
    - REDIS_PASSWORD
    - DB_PASSWORD

# Azure AKS monitoring
azureMonitor:
  enabled: true
  # Container Insights / Azure Monitor Agent
  # AKS cluster level par configured hoga

ingress:
  enabled: false
  # TODO: Confirm karna hai ki PLM API ko external ingress chahiye
  # ya sirf internal microservices access karti hain.
