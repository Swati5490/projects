apiVersion: v1
kind: Secret
metadata:
  name: {{ include "email-api.fullname" . }}-secrets
  labels:
    {{- include "email-api.labels" . | nindent 4 }}
type: Opaque
# IMPORTANT: Replace the placeholder values below with actual secrets
# Use one of these methods to create the secret:
#
# 1. Via kubectl:
#    kubectl create secret generic email-api-secrets \
#      --from-literal=redis-password='YOUR_REDIS_PASSWORD' \
#      --from-literal=mailgun-app-key='YOUR_MAILGUN_APP_KEY' \
#      --from-literal=mailgun-app-token='YOUR_MAILGUN_APP_TOKEN' \
#      -n default
#
# 2. Via Helm values (recommended):
#    helm install email-api ./email-api \
#      --set-string secrets.redisPassword='YOUR_REDIS_PASSWORD' \
#      --set-string secrets.mailgunAppKey='YOUR_MAILGUN_APP_KEY' \
#      --set-string secrets.mailgunAppToken='YOUR_MAILGUN_APP_TOKEN'
#
# 3. Via Azure Key Vault (preferred for production):
#    Update the values.yaml to reference the Key Vault provider
#
stringData:
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  mailgun-app-key: {{ .Values.secrets.mailgunAppKey | quote }}
  mailgun-app-token: {{ .Values.secrets.mailgunAppToken | quote }}
