replicaCount: 2

image:
  registry: 770526846351.dkr.ecr.us-east-1.amazonaws.com
  repository: data-feed-api
  tag: "production"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-secret

nameOverride: ""
fullnameOverride: "data-feed-api"

serviceAccount:
  create: true
  annotations: {}
  name: "data-feed-api-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "azure/application-gateway"
  hosts:
    - host: "data-feed-api.rewn.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: data-feed-api-tls
      hosts:
        - "data-feed-api.rewn.com"

resources:
  limits:
    cpu: 256m
    memory: 256Mi
  requests:
    cpu: 64m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - data-feed-api
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# Environment variables (non-sensitive)
env:
  - name: MONGO_USERNAME
    value: "mongo_admin"
  - name: REDIS_HOST
    value: "redis.rewn-state"
  - name: REDIS_PORT
    value: "43768"
  - name: NODE_ENV
    value: "production"
  - name: ACCOUNT_API_URL
    value: "https://account.rewn.io/v1"
  - name: EMAIL_API_URL
    value: "https://email.rewn.io/v1"

# Infrastructure endpoints configuration
config:
  mongoHosts: "mongorep1.rewn-state:37451,mongorep2.rewn-state:37451,mongorep3.rewn-state:37451"
  elasticsearchHosts: '["http://elasticsearch-0.elasticsearch.rewn-state:9200","http://elasticsearch-1.elasticsearch.rewn-state:9200","http://elasticsearch-2.elasticsearch.rewn-state:9200"]'

# Secrets stored in Kubernetes Secret (sensitive data)
secrets:
  mongoPassword: "mongo-password"
  redisPassword: "redis-password"
  zillowKey: "zillow-key"

logging:
  driver: awslogs
  awslogs:
    group: "/ecs/data-feed-api--production"
    region: "us-east-1"
    streamPrefix: "ecs"

# Database configuration
database:
  type: "mongodb"
  authSource: "admin"
  replicaSet: true
  ssl: false

# Elasticsearch settings
elasticsearch:
  enabled: true
  clientTimeout: 30000
  maxRetries: 3

# Redis settings
redis:
  db: 0
  tls: false
  connectTimeout: 10000

# Data feed settings
dataFeed:
  zillow:
    enabled: true
    batchSize: 100
    refreshInterval: "3600"  # Seconds
  elasticsearch:
    indexPrefix: "data-feed"
    refreshInterval: "30s"
