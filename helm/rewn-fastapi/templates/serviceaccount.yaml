apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rewn-fastapi.serviceAccountName" . }}
  labels:
    {{- include "rewn-fastapi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rewn-fastapi.fullname" . }}
  labels:
    {{- include "rewn-fastapi.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ include "rewn-fastapi.fullname" . }}"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["{{ include "rewn-fastapi.fullname" . }}"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rewn-fastapi.fullname" . }}
  labels:
    {{- include "rewn-fastapi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rewn-fastapi.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "rewn-fastapi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
