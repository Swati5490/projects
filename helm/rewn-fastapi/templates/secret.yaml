apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rewn-fastapi.fullname" . }}
  labels:
    {{- include "rewn-fastapi.labels" . | nindent 4 }}
type: Opaque
data:
  # ⚠️ EXPOSED CREDENTIALS - MUST ROTATE IN PHASE 0
  # Replace with actual values from Azure Key Vault during deployment
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  mongo-password: {{ .Values.secrets.mongoPassword | b64enc | quote }}
  mysql-password: {{ .Values.secrets.mysqlPassword | b64enc | quote }}
  ollama-api-key: {{ .Values.secrets.ollamaApiKey | b64enc | quote }}
